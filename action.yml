name: "Setup Swamp"
description: "Download and install swamp, optionally authenticate with swamp.club and initialize a repository"
branding:
  icon: "terminal"
  color: "green"

inputs:
  version:
    description: "Swamp version to install (default: latest)"
    required: false
    default: "latest"
  api-key:
    description: "API key for authenticating with swamp.club (set as SWAMP_API_KEY env var)"
    required: false
  swamp-club-url:
    description: "Override the swamp.club server URL (default: https://swamp.club)"
    required: false
  repo-init:
    description: "Run swamp repo init after setup"
    required: false
    default: "false"

outputs:
  version:
    description: "The version of swamp that was installed"
    value: ${{ steps.verify.outputs.version }}

runs:
  using: "composite"
  steps:
    - name: Determine platform and architecture
      id: platform
      shell: bash
      run: |
        OS=$(uname -s | tr '[:upper:]' '[:lower:]')
        ARCH=$(uname -m)

        case "$OS" in
          linux)  PLATFORM="linux" ;;
          darwin) PLATFORM="darwin" ;;
          *)
            echo "::error::Unsupported OS: $OS"
            exit 1
            ;;
        esac

        case "$ARCH" in
          x86_64)  ARCH="x86_64" ;;
          aarch64|arm64) ARCH="aarch64" ;;
          *)
            echo "::error::Unsupported architecture: $ARCH"
            exit 1
            ;;
        esac

        echo "platform=${PLATFORM}" >> "$GITHUB_OUTPUT"
        echo "arch=${ARCH}" >> "$GITHUB_OUTPUT"
        echo "binary=swamp-${PLATFORM}-${ARCH}" >> "$GITHUB_OUTPUT"

    - name: Resolve version
      id: version
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        if [ "$INPUT_VERSION" = "latest" ]; then
          TAG=$(gh release view --repo systeminit/swamp --json tagName --jq '.tagName')
        else
          TAG="$INPUT_VERSION"
        fi
        echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

    - name: Download swamp
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ steps.version.outputs.tag }}
        BINARY_NAME: ${{ steps.platform.outputs.binary }}
      run: |
        INSTALL_DIR="${RUNNER_TEMP}/swamp"
        mkdir -p "${INSTALL_DIR}"

        gh release download "$RELEASE_TAG" \
          --repo systeminit/swamp \
          --pattern "$BINARY_NAME" \
          --pattern "checksums.txt" \
          --dir "${INSTALL_DIR}"

        # Verify checksum
        cd "${INSTALL_DIR}"
        EXPECTED=$(grep "$BINARY_NAME" checksums.txt | awk '{print $1}')
        ACTUAL=$(sha256sum "$BINARY_NAME" | awk '{print $1}')
        if [ "$EXPECTED" != "$ACTUAL" ]; then
          echo "::error::Checksum verification failed for $BINARY_NAME"
          echo "::error::Expected: $EXPECTED"
          echo "::error::Actual:   $ACTUAL"
          exit 1
        fi
        echo "Checksum verified for $BINARY_NAME"
        rm checksums.txt

        mv "$BINARY_NAME" swamp
        chmod +x swamp

        echo "${INSTALL_DIR}" >> "$GITHUB_PATH"

    - name: Verify installation
      id: verify
      shell: bash
      run: |
        VERSION=$(swamp --version)
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        echo "Installed swamp ${VERSION}"

    - name: Mask and set SWAMP_API_KEY
      if: inputs.api-key != ''
      shell: bash
      env:
        SWAMP_API_KEY: ${{ inputs.api-key }}
      run: |
        echo "::add-mask::${SWAMP_API_KEY}"
        echo "SWAMP_API_KEY=${SWAMP_API_KEY}" >> "$GITHUB_ENV"

    - name: Set SWAMP_CLUB_URL
      if: inputs.swamp-club-url != ''
      shell: bash
      env:
        SWAMP_CLUB_URL: ${{ inputs.swamp-club-url }}
      run: |
        echo "SWAMP_CLUB_URL=${SWAMP_CLUB_URL}" >> "$GITHUB_ENV"

    - name: Verify authentication
      if: inputs.api-key != ''
      shell: bash
      env:
        SWAMP_API_KEY: ${{ inputs.api-key }}
        SWAMP_CLUB_URL: ${{ inputs.swamp-club-url }}
      run: |
        swamp auth whoami

    - name: Initialize repository
      if: inputs.repo-init == 'true'
      shell: bash
      run: |
        swamp repo init
